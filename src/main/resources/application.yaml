# Конфигурация сервера
server:
  port: 8080                          # Порт для HTTP сервера
  servlet:
    context-path: /                   # Контекстный путь (root)

# Конфигурация Spring приложения
spring:
  application:
    name: yandex-lavka               # Имя приложения для логов и мониторинга

  # Конфигурация JSON сериализации
  jackson:
    property-naming-strategy: SNAKE_CASE     # camelCase -> snake_case
    default-property-inclusion: NON_NULL     # Не включать null поля
    serialization:
      write-dates-as-timestamps: false      # ISO-8601 формат дат
    deserialization:
      fail-on-unknown-properties: false     # Игнорировать неизвестные поля

  # Конфигурация веб слоя
  mvc:
    throw-exception-if-no-handler-found: true  # 404 для несуществующих endpoints

  # Конфигурация подключения к БД
  datasource:
    url: jdbc:postgresql://localhost:5432/yandex_lavka
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: LavkaHikariPool
      auto-commit: true

  # Конфигурация JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        default_schema: lavka_schema
    open-in-view: false

  # Конфигурация Liquibase (миграции)
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    drop-first: false
    default-schema: lavka_schema

  # Конфигурация Swagger / OpenAPI
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html

# Конфигурация логирования
logging:
  level:
    root: INFO
    com.yandex.lavka: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    liquibase: INFO
    com.zaxxer.hikari: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Конфигурация управления приложением (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always